name: Build QQ Music APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: QQMusic-LiquidGlass-APK
          path: |
      **/build/outputs/apk/**/*.apk
    if-no-files-found: error
